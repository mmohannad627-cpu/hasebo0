<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="haseboGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE894" />
      <stop offset="20%" stop-color="#F5C84C" />
      <stop offset="55%" stop-color="#D4A72C" />
      <stop offset="85%" stop-color="#B38018" />
      <stop offset="100%" stop-color="#E5B83E" />
    </linearGradient>

    <linearGradient id="haseboGoldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4A72C" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>

    <!-- Deep Navy Background Gradient -->
    <linearGradient id="haseboNavyFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E192B" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>

    <!-- Shading for paper -->
    <linearGradient id="receiptPaperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <filter id="mainShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#haseboNavyFull)" rx="28" />

  <!-- Master Center Container for Emblem -->
  <g id="hasebo-emblem" transform="translate(150, 32)" filter="url(#mainShadow)">
    <!-- 1. White Invoice / Receipt Paper -->
    <g id="receipt-paper">
      <path d="M 68 28 
               C 68 20, 88 18, 108 18 
               C 128 18, 148 20, 148 28 
               L 148 132 
               L 143 126 L 138 132 L 133 126 L 128 132 L 123 126 L 118 132 L 113 126 L 108 132 
               L 103 126 L 98 132 L 93 126 L 88 132 L 83 126 L 78 132 L 73 126 L 68 132 
               Z" 
            fill="url(#receiptPaperGrad)" 
            stroke="rgba(255,255,255,0.15)"
            stroke-width="1" />

      <!-- Top Receipt Rolled Header Lip -->
      <path d="M 68 28 C 68 20, 88 18, 108 18 C 128 18, 148 20, 148 28 C 148 35, 128 33, 108 33 C 88 33, 68 35, 68 28 Z" 
            fill="#E2E8F0" />

      <!-- Horizontal Invoice Header Lines -->
      <rect x="80" y="44" width="52" height="5" rx="2.5" fill="#07111F" />
      <rect x="80" y="54" width="36" height="4.5" rx="2.25" fill="#07111F" />

      <!-- Navy Checkmark -->
      <path d="M 110 92 L 121 103 L 142 74" 
            fill="none" 
            stroke="#07111F" 
            stroke-width="6.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- 2. Golden Arabic Stylized "ح" & Growth Bars -->
    <g id="golden-ha-symbol">
      <path d="M 50 36
               C 50 28, 56 24, 66 24
               C 76 24, 84 28, 84 36
               L 84 48
               C 84 53, 80 57, 75 59
               L 56 68
               C 44 73, 38 84, 38 97
               L 38 120
               C 38 150, 62 170, 98 170
               C 136 170, 164 154, 170 141
               C 173 135, 167 129, 161 130
               C 154 131, 130 148, 98 148
               C 70 148, 56 135, 56 115
               L 56 98
               C 56 91, 62 87, 68 89
               L 132 89
               C 143 89, 150 96, 148 106
               C 145 114, 136 118, 126 115
               L 88 115
               C 81 115, 76 110, 76 104
               C 76 98, 81 94, 88 94
               L 126 94
               C 131 94, 134 97, 133 101
               C 132 104, 128 106, 123 106
               L 70 106
               C 58 106, 50 97, 50 86
               Z" 
            fill="url(#haseboGold)" />

      <!-- 3 Ascending Financial Growth Bars -->
      <rect x="56" y="130" width="7.5" height="17" rx="3.75" fill="url(#haseboGoldLight)" />
      <rect x="67" y="118" width="8" height="29" rx="4" fill="url(#haseboGoldLight)" />
      <rect x="79" y="104" width="8.5" height="43" rx="4.25" fill="url(#haseboGoldLight)" />
    </g>
  </g>

  <!-- Typography Section -->
  <g id="hasebo-typography" text-anchor="middle">
    
    <!-- Arabic Main Brand Name: حاسبو -->
    <text x="250" y="308" 
          fill="#FFFFFF" 
          font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="0.02em">حاسبو</text>

    <!-- English Brand Name: H Ā S E B O -->
    <text x="250" y="375" 
          fill="url(#haseboGold)" 
          font-family="'Montserrat', 'JetBrains Mono', 'Segoe UI', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="0.42em">HĀSEBO</text>

    <!-- Tagline Dividing Gold Lines -->
    <line x1="75" y1="418" x2="160" y2="418" stroke="url(#haseboGold)" stroke-width="2" opacity="0.9" stroke-linecap="round" />
    <line x1="340" y1="418" x2="425" y2="418" stroke="url(#haseboGold)" stroke-width="2" opacity="0.9" stroke-linecap="round" />

    <!-- Arabic Tagline: أدر تجارتك بذكاء -->
    <text x="250" y="425" 
          fill="#FFFFFF" 
          font-family="'Cairo', sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="0.02em">أدر تجارتك بذكاء</text>

    <!-- English Tagline: MANAGE YOUR BUSINESS SMARTER -->
    <text x="250" y="465" 
          fill="#94A3B8" 
          font-family="'Montserrat', 'JetBrains Mono', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.22em">MANAGE YOUR BUSINESS SMARTER</text>

  </g>
</svg>
